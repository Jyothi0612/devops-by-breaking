name: prove

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly: catches upstream image drift
  workflow_dispatch:
    inputs:
      runs:
        description: "Soak: verify each lab this many times in a row"
        default: "1"

permissions:
  contents: read

concurrency:
  group: prove-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -x dbb lib/*.sh tools/*.sh tests/*.sh labs/*/*.sh labs/*/solution/*.sh labs/*/solution/cheats/*.sh
      - name: bash 3.2 (the macOS default) can parse and run the CLI
        run: |
          . ./images.lock
          docker run --rm -v "$PWD:/repo" -w /repo "$IMG_BASH32" bash -c '
            set -e
            for f in dbb lib/*.sh tools/*.sh tests/*.sh labs/*/*.sh labs/*/solution/*.sh labs/*/solution/cheats/*.sh; do bash -n "$f"; done
            bash tests/proof.sh
            bash tests/agent-run.sh
            bash tests/paths.sh
            bash ./dbb help >/dev/null
            bash ./dbb list
            bash ./dbb list --json >/dev/null'
      - name: agent broker unit tests
        run: |
          . ./images.lock
          docker run --rm --network none -v "$PWD:/repo:ro" -w /repo "$IMG_ANSIBLE_BASE" python tests/agent_broker.py
      - name: every lab meets the bar
        run: tools/lint-lab.sh
      - name: README lab table is current
        run: tools/gen-index.sh --check
      - name: no personal data or real-looking credentials
        run: |
          if grep -rInE '@(gmail|yahoo|outlook|hotmail)\.com|AKIA[0-9A-Z]{16}|BEGIN [A-Z ]*PRIVATE KEY' \
               --exclude-dir=.git --exclude=prove.yml . ; then
            echo "Found something that must not be in a public repo"; exit 1
          fi

  labs:
    runs-on: ubuntu-24.04
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - id: ids
        run: echo "ids=$(./dbb list --json | jq -c '[.[].id]')" >> "$GITHUB_OUTPUT"

  prove:
    needs: labs
    name: ${{ matrix.lab }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lab: ${{ fromJson(needs.labs.outputs.ids) }}
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - run: ./dbb doctor
      - name: verify
        run: |
          runs="${{ github.event.inputs.runs || '1' }}"
          i=1
          while [ "$i" -le "$runs" ]; do
            echo "::group::run $i of $runs"
            ./dbb verify "${{ matrix.lab }}"
            echo "::endgroup::"
            i=$((i + 1))
          done
      - name: agent isolation and execution limits
        if: matrix.lab == 'lnx-01'
        run: bash tests/agent-integration.sh
      - name: agent tool runtime repair
        if: contains(fromJSON('["tf-01", "ans-01", "k8s-01"]'), matrix.lab)
        run: bash tests/agent-runtimes.sh "${{ matrix.lab }}"
      - name: valid Ansible alternative is accepted
        if: matrix.lab == 'ans-01'
        run: bash tests/ansible-content.sh
      - name: nothing left behind
        run: test -z "$(docker ps -aq --filter label=dbb.lab)"
