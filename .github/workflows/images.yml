name: images

on:
  push:
    branches: [main]
    paths:
      - "images/server/**"
      - "images.lock"
      - ".github/workflows/images.yml"
  pull_request:
    paths:
      - "images/server/**"
      - "images.lock"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: read pinned base image
        id: lock
        run: |
          . ./images.lock
          echo "base=$IMG_SERVER_BASE" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/server
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            BASE=${{ steps.lock.outputs.base }}
          tags: |
            ghcr.io/jyothi0612/devops-by-breaking/server:1
            ghcr.io/jyothi0612/devops-by-breaking/server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
