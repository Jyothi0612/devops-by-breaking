apiVersion: v1
kind: Namespace
metadata:
  name: billing
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-config
  namespace: billing
data:
  QUEUE_URL: "amqp://mq.billing.svc:5672"
  LOG_LEVEL: "info"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: billing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: worker
          image: busybox:1.37
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: worker-config
          command:
            - sh
            - -c
            - |
              if [ -z "${QUEUE_URL:-}" ]; then
                echo "FATAL: QUEUE_URL is not set" >&2
                exit 1
              fi
              echo "worker connected to $QUEUE_URL (log_level=${LOG_LEVEL:-info})"
              exec sleep 3600
          readinessProbe:
            exec:
              command: ["sh", "-c", "test -n \"$QUEUE_URL\""]
            initialDelaySeconds: 2
            periodSeconds: 5
