apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
    spec:
      containers:
        - name: agent
          image: busybox:1.37
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "exec sleep 3600"]
